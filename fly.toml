app = "isee-missed-connections"
primary_region = "iad"
[build]
[env]
  PORT = "3001"
  NODE_ENV = "production"
[[services]]
  internal_port = 3001
  protocol = "tcp"
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls","http"]
  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
